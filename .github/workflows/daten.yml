name: Förderdaten aktualisieren

on:
  schedule:
    # Montags 06:17 UTC – CorrelAid aktualisiert den Export montags früh
    - cron: "17 6 * * 1"
  workflow_dispatch: # Button „Run workflow“ zum Starten von Hand

permissions:
  contents: write

jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten laden und filtern
        run: python scripts/build_data.py

      - name: Änderungen speichern
        run: |
          git config user.name "foerderlotse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programme.json data/meta.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Förderdaten aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
